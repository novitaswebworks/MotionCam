name: Release macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-macos:
    name: Build and publish universal macOS DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy,rustfmt

      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          test "$tag_version" = "$app_version"

      - name: Install macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify both architectures and create checksum
        id: artifact
        run: |
          set -euxo pipefail
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          # Tauri removes the .app after building the DMG, so inspect the app
          # inside the DMG: that is the file users actually receive.
          mountpoint="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint" -force || true' EXIT
          app="$(find "$mountpoint" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          architectures="$(lipo -archs "$app/Contents/MacOS/$executable")"
          echo "App executable architectures: $architectures"
          echo "$architectures" | grep -qw arm64
          echo "$architectures" | grep -qw x86_64
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          # Publish only this version's section, not the whole changelog.
          awk -v v="## $GITHUB_REF_NAME" '$0==v{f=1;next} /^## v/{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          files=("${{ steps.artifact.outputs.dmg }}" "${{ steps.artifact.outputs.dmg }}.sha256")
          # The Windows workflow publishes the same tag; whichever finishes
          # first creates the release and the other adds its files to it.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MotionCam $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"; then
              exit 0
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
